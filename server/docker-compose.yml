# NAS 拉取模式：不本地 build，只拉 Docker Hub 镜像
#   docker compose pull && docker compose up -d
services:
  forward-bridge:
    image: poillysky/rex:latest
    pull_policy: always
    container_name: forward-bridge
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      # 建议设置口令；模块请求需带 &k=口令
      TOKEN: "改成你自己的口令"
      # 访问黄豆/野果需要代理时取消注释并改成你的代理
      # HTTP_PROXY: "http://192.168.2.1:7897"
      # HTTPS_PROXY: "http://192.168.2.1:7897"
      # NODE_USE_ENV_PROXY: "1"
