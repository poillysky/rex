# NAS 拉取模式：不本地 build，只拉 Docker Hub 镜像
# 1. 复制 .env.example 为 .env，填写 TOKEN
# 2. docker compose pull && docker compose up -d
services:
  rex-bridge:
    image: poillysky/rex:1.0.1
    pull_policy: always
    container_name: rex-bridge
    restart: always
    ports:
      - "7787:7787"
    environment:
      PORT: "7787"
      TOKEN: "${TOKEN}"
      # 若 NAS 访问站源需要代理，在 .env 里设 HTTP_PROXY / HTTPS_PROXY
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NODE_USE_ENV_PROXY: "${NODE_USE_ENV_PROXY:-}"
